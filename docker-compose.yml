x-app: &app
  build: .
  environment: &environment
    APP_ENV: ${APP_ENV:-production}
    APP_URL: ${APP_URL:?Set APP_URL}
    APP_KEY: ${APP_KEY:?Set APP_KEY}
    DB_NAME: ${DB_NAME:-krishidisha}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
    MAIL_FROM: ${MAIL_FROM:-}
    SUPPORT_CONTACT: ${SUPPORT_CONTACT:-Contact the platform administrator}
    DB_HOST: db
    DB_USER: krishidisha_app
    DB_PASSWORD: ${DB_PASSWORD:?Run python3 bin/configure.py first}
  networks: [krishidisha_net]

services:
  web:
    <<: *app
    ports: ["127.0.0.1:8080:80"]
    volumes: ["krishidisha_media:/app/storage"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  migrate:
    <<: *app
    environment:
      <<: *environment
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python3 bin/configure.py first}
      DB_APP_USER: krishidisha_app
    command: ["php", "bin/migrate.php"]
    depends_on:
      db: {condition: service_healthy}
  db:
    image: krishidisha-mysql:8.4
    build:
      context: .
      dockerfile: config/docker/mysql.Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python3 bin/configure.py first}
      MYSQL_DATABASE: krishidisha
      MYSQL_USER: krishidisha_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run python3 bin/configure.py first}
      TZ: Asia/Dhaka
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - krishidisha_db_v2:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [krishidisha_net]
    restart: unless-stopped
  browser:
    <<: *app
    profiles: [tests]
    environment:
      <<: *environment
      DB_NAME: ${BROWSER_DB:-krishidisha_browser_unused}
    ports: ["127.0.0.1:8082:80"]
    volumes: ["browser_media:/app/storage"]
    depends_on:
      db: {condition: service_healthy}
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: [tools]
    ports: ["127.0.0.1:8081:80"]
    environment: {PMA_HOST: db}
    depends_on: [db]
    networks: [krishidisha_net]

volumes:
  krishidisha_db_v2:
  krishidisha_media:
  browser_media:
networks:
  krishidisha_net:
